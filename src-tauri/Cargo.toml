[package]
name = "paste-commander"
version = "0.1.0"
description = "Cross-platform clipboard history"
authors = ["krocon"]
license = "MIT"
repository = "https://github.com/krocon/paste-commander"
edition = "2024"
rust-version = "1.85"

[lib]
# `_lib` suffix avoids a name clash with the binary on Windows (cargo#8519).
name = "paste_commander_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-single-instance = "2.5"
tauri-plugin-autostart = "2.7"
tauri-plugin-store = "2.5"
tauri-plugin-log = "2.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
sys-locale = "0.3"
thiserror = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
