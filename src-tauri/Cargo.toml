[package]
name = "paste-commander"
version = "0.1.0"
description = "Cross-platform clipboard history"
authors = ["krocon"]
license = "MIT"
repository = "https://github.com/krocon/paste-commander"
edition = "2024"
rust-version = "1.85"

[lib]
# `_lib` suffix avoids a name clash with the binary on Windows (cargo#8519).
name = "paste_commander_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-single-instance = "2.5"
tauri-plugin-autostart = "2.7"
tauri-plugin-store = "2.5"
tauri-plugin-log = "2.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
sys-locale = "0.3"
thiserror = "2"
rusqlite = { version = "0.41", features = ["bundled"] }
arboard = { version = "3.7", default-features = false }
enigo = { version = "0.6", default-features = false }
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-notification = "2.8"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
dispatch2 = "0.3"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSArray"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSPasteboard", "NSWorkspace", "NSRunningApplication", "NSResponder", "NSWindow"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.14", features = ["xfixes", "xtest"] }
wl-clipboard-rs = "0.9.5"
arboard = { version = "3.7", default-features = false, features = ["wayland-data-control"] }
enigo = { version = "0.6", default-features = false, features = ["wayland", "libei_tokio"] }
ashpd = { version = "0.14", default-features = false, features = ["tokio", "global_shortcuts"] }
futures-util = "0.3"
tokio = { version = "1", features = ["macros"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
